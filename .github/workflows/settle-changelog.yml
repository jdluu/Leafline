name: Settle changelog citations

# After a pull request lands on main, every changelog entry that cites only a
# pull request gets the commit that carried it: "(#231)" becomes
# "(390886b, #231)". A SHA written on a branch cannot survive a squash or rebase,
# so the commit can only be attached after the merge.
#
# It opens a pull request rather than pushing to main. Main is protected: three
# required checks must pass before anything lands, and that rule applies to a
# robot as much as to a person. Publishing the correction through the same gate
# keeps one path into main, and the PR body explains what changed, so the fix is
# reviewable like any other. The job succeeds without a PR when there is nothing
# to settle, and it does not open a second PR while one is already open.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: settle-changelog
  cancel-in-progress: false

jobs:
  settle:
    name: Settle changelog citations
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: resolving a pull request to its merge commit walks
          # commit subjects, which a shallow clone does not have.
          fetch-depth: 0
          fetch-tags: true

      - name: Check whether anything needs settling
        id: probe
        # Parse the count, do not just match the phrase: --dry-run prints
        # "would settle 0 citation(s)" when there is nothing to do, and a bare
        # grep for "would settle" matches that too, which then commits a clean tree.
        run: |
          count=$(bash scripts/changelog_settle.sh --dry-run | sed -n 's/^would settle \([0-9]\+\) citation(s)$/\1/p')
          if [ "${count:-0}" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "settling $count citation(s)"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to settle"
          fi

      - name: Stop if a settle pull request is already open
        id: open
        if: steps.probe.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head chore/settle-changelog --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A settle pull request is already open; leaving it to land."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Settle citations
        if: steps.probe.outputs.needed == 'true' && steps.open.outputs.skip == 'false'
        run: bash scripts/changelog_settle.sh

      - name: Verify the result
        if: steps.probe.outputs.needed == 'true' && steps.open.outputs.skip == 'false'
        run: bash scripts/check_changelog_refs.sh

      - name: Open the pull request
        if: steps.probe.outputs.needed == 'true' && steps.open.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/settle-changelog
          git add CHANGELOG.md
          git commit -m "docs: settle changelog citations with their merge commits"
          git push -u origin chore/settle-changelog
          gh pr create \
            --base main \
            --head chore/settle-changelog \
            --title "docs: settle changelog citations with their merge commits" \
            --body "Attaches the commit that carried each merged pull request to the changelog entry citing it, so an entry links both its diff and its review.

          Written by the Settle changelog citations workflow. A SHA written on a branch cannot survive a squash or rebase merge, so this can only be produced after the merge, which is why it arrives as its own pull request rather than as part of the change it describes."
