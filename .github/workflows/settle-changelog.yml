name: Settle changelog citations

# After a pull request lands on main, every changelog entry that cites only a
# pull request gets the commit that carried it, turning "(#220)" into
# "(7a77307, #220)". A SHA written on a branch cannot survive a squash or a
# rebase, so the commit can only be attached here, on main, after the merge.
#
# This commits directly to main, which is normally forbidden: the rule exists so
# human changes arrive through review, and this job is the mechanised release
# bookkeeping that review cannot perform. It touches only CHANGELOG.md, uses the
# workflow's own token, and succeeds without a change when there is nothing to do.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-changelog
  cancel-in-progress: false

jobs:
  settle:
    name: Settle changelog citations
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: resolving a pull request to its merge commit walks
          # commit subjects, which a shallow clone does not have.
          fetch-depth: 0
          fetch-tags: true

      - name: Check whether anything needs settling
        id: probe
        run: |
          if bash scripts/changelog_settle.sh --dry-run | grep -q 'would settle'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Settle citations
        if: steps.probe.outputs.needed == 'true'
        run: bash scripts/changelog_settle.sh

      - name: Verify the result
        if: steps.probe.outputs.needed == 'true'
        run: bash scripts/check_changelog_refs.sh

      - name: Commit
        if: steps.probe.outputs.needed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: settle changelog citations with their merge commits

          Written by the Settle changelog citations workflow, which attaches the
          commit that carried each pull request to the entry that cites it. A SHA
          written on a branch does not survive a squash or rebase merge, so this
          can only happen here."
          git push
