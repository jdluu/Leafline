name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      # Robolectric downloads its android-all jar from Maven during the test run, and
      # that download times out often enough to turn a green suite red for reasons
      # unrelated to the change. Caching the directory makes the download a cache hit;
      # the key includes the Gradle files so a Robolectric upgrade re-fetches.
      - name: Cache Robolectric artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin

      - name: Run unit tests
        # The Readium Theme JVM class-init failures were fixed at the root by
        # isolating the theme behind a pure Kotlin type (#90). The gate is now
        # strict: any test failure fails CI.
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  quality-guards:
    name: Quality guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Full history and tags: the changelog guard resolves cited commits with
        # git, and a shallow clone would report every reference as dangling.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Dynamic type guard
        run: bash scripts/check_dynamic_type.sh

      - name: Touch target guard
        run: bash scripts/check_touch_targets.sh

      # Needs history and tags, so it can prove a cited commit exists and is on
      # the branch; a shallow clone would report every reference as dangling.
      - name: Changelog attribution guard
        run: bash scripts/check_changelog_refs.sh
