name: Release

# Publishing a tag is the whole release. GitHub builds the notes from the pull
# requests between the previous tag and this one, so every line in the notes is a
# real link to the PR that caused it and carries its author. Nothing is
# hand-written and nothing can drift: a merged PR cannot be missing, because the
# notes are derived from the commits rather than maintained beside them.

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run: build and verify the APK, skip publishing. Lets the signing path be
  # exercised without creating a release or burning a version number.
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and verify the APK without publishing a release"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # generate-notes walks history back to the previous tag.
          fetch-depth: 0
          fetch-tags: true

      # A tag whose name disagrees with the tree ships an APK that reports the
      # older versionName under a release page that claims the newer one, and
      # nothing downstream catches it: the build reads the file, not the tag.
      # A manual dry run has a branch ref, so the step is skipped for it. The
      # ref name comes from the default GITHUB_REF_NAME variable and is never
      # interpolated into this script, so a hostile tag name cannot inject shell.
      - name: Verify the tag matches the version in the tree
        if: github.ref_type == 'tag'
        run: |
          version_name=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          expected="${GITHUB_REF_NAME#v}"
          if [ -z "$version_name" ]; then
            echo "FAIL: no versionName found in app/build.gradle.kts"
            exit 1
          fi
          if [ "$version_name" != "$expected" ]; then
            echo "FAIL: tag ${GITHUB_REF_NAME} does not match versionName \"$version_name\" in app/build.gradle.kts"
            echo "Bump the version in the commit being tagged, or tag the release commit."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} matches versionName \"$version_name\""

      # The versionName check above catches a tag on the wrong commit. This
      # catches the other half: a bump that moves versionName and forgets
      # versionCode, which passes that check and still ships an APK Android
      # refuses to install over the previous release. The previous tag is the
      # one the notes range is computed from, resolved the same way.
      - name: Verify versionCode exceeds the previous release
        if: github.ref_type == 'tag'
        run: |
          # The checkout can be trimmed (fetch-tags off, a narrowed ref), and then
          # an absent tag would read as "first release". Fetch the real tag set
          # first: under `-e` a failed fetch fails the step, and once the tags are
          # present an empty `previous` really does mean no earlier release.
          git fetch --tags --force --quiet origin
          version_code=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -z "$version_code" ]; then
            echo "FAIL: no versionCode found in app/build.gradle.kts"
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            # A failed lookup means one of three things, and only one of them is
            # a legitimate first release. Split them or the guard reports OK on
            # the run where it could not compare anything.
            if ! git rev-parse -q --verify "${GITHUB_REF_NAME}^{commit}" >/dev/null; then
              echo "FAIL: ${GITHUB_REF_NAME} is not a commit in this checkout, so no comparison is possible"
              echo "Refusing to skip the versionCode check."
              exit 1
            fi
            if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
              echo "FAIL: shallow checkout cannot resolve the previous release for ${GITHUB_REF_NAME}"
              echo "Refusing to skip the versionCode check. Check out with fetch-depth: 0."
              exit 1
            fi
            echo "OK: ${GITHUB_REF_NAME} is the first release; versionCode $version_code has nothing to exceed"
            exit 0
          fi
          previous_code=$(git show "${previous}:app/build.gradle.kts" 2>/dev/null | sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' || true)
          if [ -z "$previous_code" ]; then
            echo "FAIL: no versionCode found in ${previous}:app/build.gradle.kts"
            exit 1
          fi
          if [ "$version_code" -le "$previous_code" ]; then
            echo "FAIL: versionCode $version_code does not exceed ${previous}'s $previous_code, so Android refuses the in-place update"
            exit 1
          fi
          echo "OK: versionCode $version_code exceeds ${previous}'s $previous_code"

      # The APK is what a reader installs, so a release without one is not a
      # release. Signed only when the four signing properties are configured;
      # otherwise this fails rather than publishing an unsigned artifact.
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build release APK
        env:
          # The keystore travels as base64 and is materialised here: an absolute
          # path from a developer machine means nothing on a runner. Everything
          # that writes a credential stays in this environment block, so the
          # values never reach the runner's log.
          LEAFLINE_KEYSTORE_BASE64: ${{ secrets.LEAFLINE_KEYSTORE_BASE64 }}
          LEAFLINE_STORE_PASSWORD: ${{ secrets.LEAFLINE_STORE_PASSWORD }}
          LEAFLINE_KEY_ALIAS: ${{ secrets.LEAFLINE_KEY_ALIAS }}
          LEAFLINE_KEY_PASSWORD: ${{ secrets.LEAFLINE_KEY_PASSWORD }}
          # Not a secret (PKCE carries the proof), but the build needs it: without it
          # BuildConfig.HARDCOVER_CLIENT_ID is blank and the release APK ships with
          # OAuth hidden, which is exactly what happened in v0.4.13.
          HARDCOVER_CLIENT_ID: ${{ vars.HARDCOVER_CLIENT_ID }}
        run: |
          missing=0
          for v in LEAFLINE_KEYSTORE_BASE64 LEAFLINE_STORE_PASSWORD LEAFLINE_KEY_ALIAS LEAFLINE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "FAIL: secret $v is not set"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          # A blank client id would silently ship a release where Hardcover sign-in
          # does not exist, so fail here instead of discovering it in the APK.
          if [ -z "${HARDCOVER_CLIENT_ID:-}" ]; then
            echo "FAIL: HARDCOVER_CLIENT_ID is not set (repository variable)."
            echo "Set it with: gh variable set HARDCOVER_CLIENT_ID --body <uuid>"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$LEAFLINE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/leafline-release.jks"
          chmod 600 "$RUNNER_TEMP/keys/leafline-release.jks"
          ls -l "$RUNNER_TEMP/keys/leafline-release.jks" | awk '{print "keystore:", $5, "bytes"}'

          {
            printf 'LEAFLINE_STORE_FILE=%s\n' "$RUNNER_TEMP/keys/leafline-release.jks"
            printf 'LEAFLINE_STORE_PASSWORD=%s\n' "$LEAFLINE_STORE_PASSWORD"
            printf 'LEAFLINE_KEY_ALIAS=%s\n' "$LEAFLINE_KEY_ALIAS"
            printf 'LEAFLINE_KEY_PASSWORD=%s\n' "$LEAFLINE_KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
          ./gradlew :app:assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Verify the APK is signed
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify Hardcover OAuth is compiled in
        env:
          HARDCOVER_CLIENT_ID: ${{ vars.HARDCOVER_CLIENT_ID }}
        run: |
          # The signed APK is what ships; assert the id actually reached the dex,
          # rather than trusting that the build picked the variable up.
          # Scan every classesN.dex: this app is multidex and the constant does not
          # land in classes.dex, which is a false negative worth avoiding twice.
          apk=app/build/outputs/apk/release/app-release.apk
          found=0
          for dex in $(unzip -l "$apk" | awk '/classes[0-9]*\.dex$/ {print $4}'); do
            if unzip -p "$apk" "$dex" | grep -qa "$HARDCOVER_CLIENT_ID"; then
              echo "OK: client id found in $dex"
              found=1
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "FAIL: no Hardcover client id in any dex, so OAuth is hidden in this build"
            echo "dex entries were: $(unzip -l "$apk" | awk '/classes[0-9]*\.dex$/ {print $4}' | tr '\n' ' ')"
            exit 1
          fi

      - name: Publish
        # A tag push publishes; a manual run with build_only does not.
        if: ${{ github.event_name == 'push' || inputs.build_only == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag flows into a shell command, so constrain it to a release
          # shape rather than trusting an arbitrary ref name.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "FAIL: unexpected tag name: $TAG"; exit 1 ;;
          esac
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          # --verify-tag refuses to invent a release for a tag that does not exist.
          gh release create "$TAG" \
            --verify-tag \
            --title "Leafline $TAG" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            app/build/outputs/apk/release/app-release.apk
