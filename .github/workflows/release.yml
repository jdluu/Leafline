name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          # Tag format is v<semver>; strip the leading v for the APK name.
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEAFLINE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEAFLINE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEAFLINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LEAFLINE_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leafline-release.jks"
          {
            echo "LEAFLINE_STORE_FILE=$RUNNER_TEMP/leafline-release.jks"
            echo "LEAFLINE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "LEAFLINE_KEY_ALIAS=$KEY_ALIAS"
            echo "LEAFLINE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
          echo "signing=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Run unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --continue > test_output.txt 2>&1
          failed=$(grep -oE "[0-9]+ tests completed, [0-9]+ failed" test_output.txt | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+" || echo 0)
          if [ "$failed" -gt 8 ]; then
            echo "::error::Unit tests regressed: $failed failures"
            exit 1
          fi

      - name: Locate APK
        id: apk
        run: |
          # Prefer the signed APK when signing succeeded; fall back to unsigned.
          APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null \
             || ls app/build/outputs/apk/release/app-release-unsigned.apk)
          DEST="Leafline-${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
