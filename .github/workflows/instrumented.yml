name: Instrumented

# Full connectedDebugAndroidTest requires a device-attached runner (for example
# self-hosted), which hosted runners do not provide. This manual job therefore
# acts only as a compile gate for androidTest sources and intentionally does
# not block PRs; run scripts/run-instrumented.sh locally for real execution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-test:
    name: Compile androidTest sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Compile androidTest sources
        run: ./gradlew :app:compileDebugAndroidTestKotlin
